name: jarvis_voice_agent
description: "Jarvis-style push-to-talk voice assistant using Flutter and a FastAPI backend."
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Voice & audio
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.6

  # Networking
  http: ^1.2.0

  # Permissions
  permission_handler: ^11.3.0

  # State management
  provider: ^6.1.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Local notifications
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true